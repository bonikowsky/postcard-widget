<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-transparent m-0 p-0">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const sheetUrl = 'https://script.google.com/macros/s/AKfycbzvR2fIFz2KkWzhVzREqv_GSGN7aZBfUPQVdJaKsLjclimLFLt5WpmkxvwVIMmW-0Ek/exec';
        const [currentAmount, setCurrentAmount] = React.useState(968.71);
        const [isLoaded, setIsLoaded] = React.useState(false);
        const [errorDetails, setErrorDetails] = React.useState(null);

        const BUDGET_ERRENTERIA = 1896.64;
        const BUDGET_TOTAL = 4433.65;
        const HOMES_ERRENTERIA = 17581;
        const HOMES_OUTSIDE = 23517;
        const TOTAL_SLOTS = 144;

        const fundingForErrenteria = Math.min(currentAmount, BUDGET_ERRENTERIA);
        const fundingForOutside = Math.max(0, currentAmount - BUDGET_ERRENTERIA);
        const clampedOutside = Math.min(fundingForOutside, BUDGET_TOTAL - BUDGET_ERRENTERIA);

        const errRatio = fundingForErrenteria / BUDGET_ERRENTERIA;
        const outRatio = clampedOutside / (BUDGET_TOTAL - BUDGET_ERRENTERIA);

        const errenteriaFundedHomes = Math.floor(errRatio * HOMES_ERRENTERIA);
        const outsideFundedHomes = Math.floor(outRatio * HOMES_OUTSIDE);

        const errPercent = Math.min(100, Math.round(errRatio * 100));
        const outPercent = Math.min(100, Math.round(outRatio * 100));

        const activeErrCount = Math.floor(errRatio * TOTAL_SLOTS);
        const activeOutCount = Math.floor(outRatio * TOTAL_SLOTS);

        const fetchSheetData = async () => {
          try {
            setErrorDetails(null);
            const response = await fetch(sheetUrl);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            
            let foundVal = null;
            if (data !== null && typeof data === 'object') {
              const possibleKeys = ['totalFunds', 'amount', 'currentAmount', 'value', 'total'];
              for (let key of possibleKeys) {
                if (data[key] !== undefined && !isNaN(parseFloat(data[key]))) {
                  foundVal = parseFloat(data[key]);
                  break;
                }
              }
              if (foundVal === null) {
                for (let val of Object.values(data)) {
                  const parsed = parseFloat(val);
                  if (!isNaN(parsed)) { foundVal = parsed; break; }
                }
              }
            }

            if (foundVal !== null) {
              setCurrentAmount(foundVal);
              setIsLoaded(true);
            } else {
              setErrorDetails(`Could not find numeric value in JSON response`);
            }
          } catch (err) {
            console.error('Background sync failed:', err);
            setErrorDetails(err.message);
          }
        };

        React.useEffect(() => {
          fetchSheetData();
          const interval = setInterval(fetchSheetData, 60000);
          return () => clearInterval(interval);
        }, []);

        return (
          <div className="p-2 flex flex-col items-center justify-center bg-transparent">
            <div className="w-full bg-white rounded-xl shadow-sm border border-slate-200 p-3">
              {/* Forced 2 columns side-by-side */}
              <div className="grid grid-cols-2 gap-4">
                
                {/* ERRENTERIA */}
                <div className="bg-slate-50/60 border border-slate-200/80 rounded-xl p-3 flex flex-col items-center">
                  <h3 className="font-bold text-slate-800 text-xs tracking-wide uppercase mb-2">Errenteria</h3>
                  <div className="grid grid-cols-[repeat(18,minmax(0,1fr))] gap-1 w-full mb-2 p-1 bg-white rounded-lg border border-slate-100">
                    {Array.from({ length: TOTAL_SLOTS }).map((_, i) => (
                      <div key={`err-${i}`} className="aspect-square flex items-center justify-center">
                        <svg viewBox="0 0 24 24" className="w-full h-full transition-all duration-200" fill={i < activeErrCount ? '#3b82f6' : '#cbd5e1'}>
                          <path d="M12 2L1 12h3v9h6v-6h4v6h6v-9h3L12 2z"/>
                        </svg>
                      </div>
                    ))}
                  </div>
                  <div className="text-center font-bold text-xs text-slate-800">
                    {errPercent}% FUNDED ({errenteriaFundedHomes.toLocaleString()} Homes Covered)
                  </div>
                </div>

                {/* SURROUNDING TOWNS */}
                <div className="bg-slate-50/60 border border-slate-200/80 rounded-xl p-3 flex flex-col items-center">
                  <h3 className="font-bold text-slate-800 text-xs tracking-wide uppercase mb-2 text-center">
                    Surrounding Towns <span className="font-normal text-slate-500">(Lezo, Pasaia, Altza)</span>
                  </h3>
                  <div className="grid grid-cols-[repeat(18,minmax(0,1fr))] gap-1 w-full mb-2 p-1 bg-white rounded-lg border border-slate-100">
                    {Array.from({ length: TOTAL_SLOTS }).map((_, i) => (
                      <div key={`out-${i}`} className="aspect-square flex items-center justify-center">
                        <svg viewBox="0 0 24 24" className="w-full h-full transition-all duration-200" fill={i < activeOutCount ? '#10b981' : '#cbd5e1'}>
                          <path d="M12 2L1 12h3v9h6v-6h4v6h6v-9h3L12 2z"/>
                        </svg>
                      </div>
                    ))}
                  </div>
                  <div className="text-center font-bold text-xs text-slate-800">
                    {outPercent > 0 ? `${outPercent}% FUNDED (${outsideFundedHomes.toLocaleString()} Homes Covered)` : '0% FUNDED'}
                  </div>
                </div>

              </div>

              {errorDetails && (
                <div className="mt-2 text-[10px] text-amber-600 bg-amber-50 p-1.5 rounded border border-amber-200 text-center">
                  ⚠️ Live sync warning: {errorDetails}
                </div>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
