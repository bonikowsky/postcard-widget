<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Tracker</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .tracker-card {
        background: #ffffff;
        border-radius: 0.5rem;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        padding: 4px;
        box-sizing: border-box;
      }
      .tracker-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .section-box {
        background: rgba(248, 250, 252, 0.6);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 0.375rem;
        padding: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        overflow: hidden;
      }
      .houses-grid {
        display: grid;
        grid-template-columns: repeat(18, minmax(0, 1fr));
        gap: 0px;
        width: 100%;
        margin-bottom: 2px;
        padding: 2px;
        background: #ffffff;
        border-radius: 0.25rem;
        border: 1px solid #f1f5f9;
        box-sizing: border-box;
      }
      .house-icon {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .house-icon svg {
        width: 100%;
        height: 100%;
      }
      .section-title {
        font-weight: 700;
        color: #1e293b;
        font-size: 9px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        margin-bottom: 2px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .section-subtitle {
        font-weight: 400;
        color: #64748b;
        font-size: 7.5px;
      }
      .stat-text {
        text-align: center;
        font-weight: 700;
        font-size: 8.5px;
        color: #1e293b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .error-box {
        margin-top: 2px;
        font-size: 8px;
        color: #d97706;
        background: #fffbeb;
        padding: 2px;
        border-radius: 0.25rem;
        border: 1px solid #fde68a;
        text-align: center;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const sheetUrl = 'https://script.google.com/macros/s/AKfycbzvR2fIFz2KkWzhVzREqv_GSGN7aZBfUPQVdJaKsLjclimLFLt5WpmkxvwVIMmW-0Ek/exec';
        const [currentAmount, setCurrentAmount] = React.useState(968.71);
        const [errorDetails, setErrorDetails] = React.useState(null);

        const BUDGET_ERRENTERIA = 1896.64;
        const BUDGET_TOTAL = 4433.65;
        const HOMES_ERRENTERIA = 17581;
        const HOMES_OUTSIDE = 23517;
        const TOTAL_SLOTS = 144;

        const fundingForErrenteria = Math.min(currentAmount, BUDGET_ERRENTERIA);
        const fundingForOutside = Math.max(0, currentAmount - BUDGET_ERRENTERIA);
        const clampedOutside = Math.min(fundingForOutside, BUDGET_TOTAL - BUDGET_ERRENTERIA);

        const errRatio = fundingForErrenteria / BUDGET_ERRENTERIA;
        const outRatio = clampedOutside / (BUDGET_TOTAL - BUDGET_ERRENTERIA);

        const errenteriaFundedHomes = Math.floor(errRatio * HOMES_ERRENTERIA);
        const outsideFundedHomes = Math.floor(outRatio * HOMES_OUTSIDE);

        const errPercent = Math.min(100, Math.round(errRatio * 100));
        const outPercent = Math.min(100, Math.round(outRatio * 100));

        const activeErrCount = Math.floor(errRatio * TOTAL_SLOTS);
        const activeOutCount = Math.floor(outRatio * TOTAL_SLOTS);

        const fetchSheetData = async () => {
          try {
            setErrorDetails(null);
            const response = await fetch(sheetUrl);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            
            let foundVal = null;
            if (data !== null && typeof data === 'object') {
              const possibleKeys = ['totalFunds', 'amount', 'currentAmount', 'value', 'total'];
              for (let key of possibleKeys) {
                if (data[key] !== undefined && !isNaN(parseFloat(data[key]))) {
                  foundVal = parseFloat(data[key]);
                  break;
                }
              }
              if (foundVal === null) {
                for (let val of Object.values(data)) {
                  const parsed = parseFloat(val);
                  if (!isNaN(parsed)) { foundVal = parsed; break; }
                }
              }
            }

            if (foundVal !== null) {
              setCurrentAmount(foundVal);
            } else {
              setErrorDetails(`Could not find numeric value in JSON response`);
            }
          } catch (err) {
            console.error('Background sync failed:', err);
            setErrorDetails(err.message);
          }
        };

        React.useEffect(() => {
          fetchSheetData();
          const interval = setInterval(fetchSheetData, 60000);
          return () => clearInterval(interval);
        }, []);

        return (
          <div style={{ padding: '2px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', width: '100%', boxSizing: 'border-box', background: 'transparent' }}>
            <div className="tracker-card" style={{ width: '100%' }}>
              
              <div className="tracker-grid">
                
                {/* ERRENTERIA */}
                <div className="section-box">
                  <div className="section-title">Errenteria</div>
                  <div className="houses-grid">
                    {Array.from({ length: TOTAL_SLOTS }).map((_, i) => (
                      <div key={`err-${i}`} className="house-icon">
                        <svg viewBox="0 0 24 24" fill={i < activeErrCount ? '#3b82f6' : '#cbd5e1'}>
                          <path d="M12 2L1 12h3v9h6v-6h4v6h6v-9h3L12 2z"/>
                        </svg>
                      </div>
                    ))}
                  </div>
                  <div className="stat-text">
                    {errPercent}% ({errenteriaFundedHomes.toLocaleString()} Homes)
                  </div>
                </div>

                {/* SURROUNDING TOWNS */}
                <div className="section-box">
                  <div className="section-title">
                    Surrounding <span className="section-subtitle">(Lezo, Pasaia, Altza, Oiartzun)</span>
                  </div>
                  <div className="houses-grid">
                    {Array.from({ length: TOTAL_SLOTS }).map((_, i) => (
                      <div key={`out-${i}`} className="house-icon">
                        <svg viewBox="0 0 24 24" fill={i < activeOutCount ? '#10b981' : '#cbd5e1'}>
                          <path d="M12 2L1 12h3v9h6v-6h4v6h6v-9h3L12 2z"/>
                        </svg>
                      </div>
                    ))}
                  </div>
                  <div className="stat-text">
                    {outPercent}% ({outsideFundedHomes.toLocaleString()} Homes)
                  </div>
                </div>

              </div>

              {errorDetails && (
                <div className="error-box">
                  ⚠️ Live sync warning: {errorDetails}
                </div>
              )}
            </div>
          </div>
        );
      }

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
</body>
</html>
