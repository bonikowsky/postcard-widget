<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Tracker</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .tracker-card {
        background: #ffffff;
        border-radius: 0.75rem;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      /* Pure CSS Grid forcing 2 equal side-by-side columns */
      .tracker-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      .section-box {
        background: rgba(248, 250, 252, 0.6);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 0.5rem;
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        overflow: hidden;
      }
      .houses-grid {
        display: grid;
        grid-template-columns: repeat(18, minmax(0, 1fr));
        gap: 1px;
        width: 100%;
        margin-bottom: 0.375rem;
        padding: 0.25rem;
        background: #ffffff;
        border-radius: 0.25rem;
        border: 1px solid #f1f5f9;
        box-sizing: border-box;
      }
      .house-icon {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .house-icon svg {
        width: 100%;
        height: 100%;
      }
      .section-title {
        font-weight: 700;
        color: #1e293b;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .section-subtitle {
        font-weight: 400;
        color: #64748b;
        font-size: 8px;
      }
      .stat-text {
        text-align: center;
        font-weight: 700;
        font-size: 9px;
        color: #1e293b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .error-box {
        margin-top: 0.25rem;
        font-size: 9px;
        color: #d97706;
        background: #fffbeb;
        padding: 0.25rem;
        border-radius: 0.25rem;
        border: 1px solid #fde68a;
        text-align: center;
      }
    </style>
</head>
